<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Afritop Ventures Ltd - Excellence In Every Detail. Engineering, Construction, and ICT Solutions." />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Afritop Ventures Ltd</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              brand: {
                blue: '#1e3a5f', // Company Dark Blue
                gold: '#f59e0b', // Company Gold/Yellow
                light: '#fef3c7', // Light yellow tint
                orange: '#f97316', // Orange accent from profile
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Custom scrollbar for a cleaner look */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      /* Animation for language switcher dropdown */
      .animate-fadeIn {
        animation: fadeIn 0.2s ease-in-out;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-4px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* RTL support for Arabic */
      [dir="rtl"] .space-x-6 > :not([hidden]) ~ :not([hidden]) {
        --tw-space-x-reverse: 1;
      }
      [dir="rtl"] .ml-6 {
        margin-left: 0;
        margin-right: 1.5rem;
      }
      [dir="rtl"] .mr-2 {
        margin-right: 0;
        margin-left: 0.5rem;
      }
      [dir="rtl"] .mr-3 {
        margin-right: 0;
        margin-left: 0.75rem;
      }
      [dir="rtl"] .mr-4 {
        margin-right: 0;
        margin-left: 1rem;
      }
      [dir="rtl"] .ml-2 {
        margin-left: 0;
        margin-right: 0.5rem;
      }
      [dir="rtl"] .ml-auto {
        margin-left: 0;
        margin-right: auto;
      }
      [dir="rtl"] .text-left {
        text-align: right;
      }
      [dir="rtl"] .pl-6 {
        padding-left: 0;
        padding-right: 1.5rem;
      }
      [dir="rtl"] .-left-4 {
        left: auto;
        right: -1rem;
      }
      [dir="rtl"] .-right-6 {
        right: auto;
        left: -1.5rem;
      }
      [dir="rtl"] .rounded-tl-3xl {
        border-top-left-radius: 0;
        border-top-right-radius: 1.5rem;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
